version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: logcentral-db
    environment:
      POSTGRES_USER: logcentral
      POSTGRES_PASSWORD: logcentral2024
      POSTGRES_DB: logcentral
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logcentral"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
